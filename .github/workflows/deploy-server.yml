name: Deploy to Server

on:
  push:
    branches:
      - main
      - claude/website-auto-deploy-vnolom
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否已配置服务器密码
        id: cfg
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PW: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$PW" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  未配置 SERVER_HOST / SERVER_PASSWORD,跳过服务器部署(配好后自动部署)。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: 安装 sshpass / rsync
        if: steps.cfg.outputs.configured == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y sshpass rsync

      - name: 初始化服务器(安装 nginx + 配置站点,监听 8080)
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PreferredAuthentications=password \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' < deploy/setup.sh

      - name: 同步网站文件到服务器
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'deploy' \
            --exclude 'node_modules' \
            --exclude '.DS_Store' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password -p ${{ secrets.SERVER_PORT }}" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/website/"

      - name: 完成
        if: steps.cfg.outputs.configured == 'true'
        run: echo "✅ 已部署到服务器 http://${{ secrets.SERVER_HOST }}:8080/"
