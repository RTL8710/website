name: Deploy to Server

# push 后自动把最新静态文件同步到自建服务器 anhaishi.cn。
# 只做 git 拉取(git reset --hard),**绝不重配 nginx / 不碰 SSL**——
# 这是与被删的旧版(会跑 setup.sh 把 nginx 重置成 8080、冲掉 443+SSL)的关键区别。
# 复用仓库已有的 Actions Secrets:SERVER_HOST / SERVER_PORT / SERVER_USER / SERVER_PASSWORD。

on:
  push:
    branches:
      - main
      - claude/website-auto-deploy-vnolom
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否已配置服务器 Secrets
        id: cfg
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PW: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$PW" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  未配置 SERVER_HOST / SERVER_PASSWORD,跳过服务器同步(在仓库 Settings→Secrets 配好后自动生效)。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 sshpass
        if: steps.cfg.outputs.configured == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: 服务器 git 拉取最新(只更新静态文件,不动 nginx/SSL)
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          BR: ${{ github.ref_name }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no -o PreferredAuthentications=password \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "git config --global --add safe.directory /var/www/website && \
             git -C /var/www/website fetch --depth 1 origin '$BR' && \
             git -C /var/www/website reset --hard 'origin/$BR' && \
             echo '已同步到' \$(git -C /var/www/website rev-parse --short HEAD)"

      - name: 完成
        if: steps.cfg.outputs.configured == 'true'
        run: echo "✅ 已同步到自建服务器 https://${{ secrets.SERVER_HOST }}/(仅静态文件,nginx/SSL 未动)"
