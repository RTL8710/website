name: Deploy to Server

# push 后自动把最新静态文件同步到自建服务器 anhaishi.cn。
# 只做 git 拉取(fetch + reset --hard),**绝不重配 nginx / 不碰 SSL**——
# 与被删的旧版(会跑 setup.sh 把 nginx 重置成 8080、冲掉 443+SSL)的关键区别。
# 复用仓库已有的 Actions Secrets:SERVER_HOST / SERVER_PORT / SERVER_USER / SERVER_PASSWORD。

on:
  push:
    branches:
      - main
      - claude/website-auto-deploy-vnolom
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查是否已配置服务器 Secrets
        id: cfg
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PW: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$PW" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  未配置 SERVER_HOST / SERVER_PASSWORD,跳过。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 sshpass
        if: steps.cfg.outputs.configured == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: 服务器 git 拉取最新(只更新静态文件,不动 nginx/SSL)
        if: steps.cfg.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USER }}
          HOST: ${{ secrets.SERVER_HOST }}
          BR: ${{ github.ref_name }}
          WEBROOT: /var/www/website
        run: |
          REMOTE="git config --global --add safe.directory $WEBROOT && git -C $WEBROOT fetch --depth 1 origin $BR && git -C $WEBROOT reset --hard origin/$BR && git -C $WEBROOT rev-parse --short HEAD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=30 -p "$PORT" "$USER@$HOST" "$REMOTE"

      - name: 完成
        if: steps.cfg.outputs.configured == 'true'
        run: echo "✅ 已同步到自建服务器 https://${{ secrets.SERVER_HOST }}/(仅静态文件,nginx/SSL 未动)"
