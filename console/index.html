<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- 主题防闪:首屏渲染前套用 dv_theme(与设备端共用),避免默认主题闪一下 -->
<script>try{var _th=localStorage.getItem('dv_theme')||'dark';document.documentElement.setAttribute('data-theme',_th);}catch(e){}</script>
<title>设备管理控制台 · Device Console</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<!-- 本地字体 / Cognito / hls：全部同源，避免 esm.sh / Google Fonts / jsdelivr 冷加载 -->
<script>window.global=window.globalThis||window;</script>
<link rel="modulepreload" href="./vendor/amazon-cognito-identity-js.esm.js">
<link rel="preload" href="device/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="device/fonts/noto-sans-sc-cn-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="device/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<!-- Font Awesome(复用设备端 vendored 版,登录页 hero/表单图标用)-->
<link rel="stylesheet" href="device/css/all.min.css">
<!-- hls.js(UMD,固定版本)→ window.Hls -->
<script src="vendor/hls.min.js"></script>
<!-- vendored(搬自 ipcwebsite,已验证):IoT SigV4 用 CryptoJS + MQTT-over-WSS -->
<script src="vendor/crypto.js"></script>
<script src="vendor/mqtt.min.js"></script>
